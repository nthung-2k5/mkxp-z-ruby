name: macOS
on:
  # push:
  #   paths-ignore:
  #     - 'doc/**'
  #     - '**.md'
  #     - '**.rdoc'
  # pull_request:
  #   paths-ignore:
  #     - 'doc/**'
  #     - '**.md'
  #     - '**.rdoc'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }} / ${{ startsWith(github.event_name, 'pull') && github.ref_name || github.sha }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull') }}

jobs:
  make:
    env:
      GITPULLOPTIONS: --no-tags origin ${{github.ref}}
      CCACHE_DIR: "${{ github.workspace }}/.ccache"
    runs-on: macos-latest
    if: ${{ !contains(github.event.head_commit.message, '[DOC]') && !contains(github.event.pull_request.labels.*.name, 'Documentation') }}
    steps:
      - run: mkdir -p build $HOME/ruby
        working-directory:
      - name: git config
        run: |
          git config --global advice.detachedHead 0
          git config --global init.defaultBranch garbage
      - uses: actions/checkout@v5
        with:
          path: src
      - uses: actions/cache@v5
        with:
          path: src/.downloaded-cache
          key: downloaded-cache
      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-macos
      - name: Install libraries
        run: |
          brew upgrade
          brew install libffi zlib autoconf automake libtool ccache
        working-directory: src
      - name: Set ENV
        run: |
          echo "MAKEFLAGS=-j$((1 + $(sysctl -n hw.activecpu)))" >> $GITHUB_ENV
      - run: ./autogen.sh
        working-directory: src
      - name: Run configure
        run: >-
          ../src/configure -C --enable-shared --disable-install-doc
          --prefix="${HOME}/ruby"
          --enable-install-static-library
          --with-out-ext=openssl,readline,dbm,gdbm,win32ole
          --with-static-linked-ext
          --disable-rubygems
          --without-gmp
          --with-opt-dir=$(brew --prefix libffi)
          --with-zlib-dir=$(brew --prefix zlib)
        env:
          CFLAGS: "-std=gnu99 -flto=auto"
          LDFLAGS: "-flto=auto"
          CC: "ccache clang"
          CXX: "ccache clang++"
      - run: make miniruby
      - run: make
      - run: make install-nodoc
      - uses: actions/upload-artifact@v7
        with:
          name: ruby-macos
          path: ~/ruby

defaults:
  run:
    working-directory: build
