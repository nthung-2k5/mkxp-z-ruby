name: MinGW
on:
  push:
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '**.rdoc'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**.md'
      - '**.rdoc'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }} / ${{ startsWith(github.event_name, 'pull') && github.ref_name || github.sha }}
  cancel-in-progress: ${{ startsWith(github.event_name, 'pull') }}

jobs:
  make:
    runs-on: windows-2022
    env:
      MSYSTEM: UCRT64
      MSYS2_ARCH: x86_64
      CHOST: "x86_64-w64-mingw32"
      CFLAGS:   "-march=x86-64 -mtune=generic -O3 -pipe -fstack-protector-strong -std=gnu99 -flto"
      CXXFLAGS: "-march=x86-64 -mtune=generic -O3 -pipe"
      CPPFLAGS: "-D_FORTIFY_SOURCE=2 -D__USE_MINGW_ANSI_STDIO=1 -DFD_SETSIZE=2048"
      LDFLAGS:  "-flto -pipe -fstack-protector-strong"
      UPDATE_UNICODE: "UNICODE_FILES=. UNICODE_PROPERTY_FILES=. UNICODE_AUXILIARY_FILES=. UNICODE_EMOJI_FILES=."
      GITPULLOPTIONS: --no-tags origin ${{github.ref}}
    if: ${{ !startsWith(github.event.head_commit.message, '[DOC]') && !contains(github.event.pull_request.labels.*.name, 'Documentation') }}
    steps:
      - run: mkdir build
        working-directory:
      - name: git config
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global advice.detachedHead 0
          git config --global init.defaultBranch garbage
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/cache@v4
        with:
          path: src/.downloaded-cache
          key: downloaded-cache
      # - name: setup MSYS2
      #   uses: msys2/setup-msys2@v2
      #   with:
      #     msystem: UCRT64
      #     release: false
      #     update: true
      #     install: >-
      #       mingw-w64-ucrt-x86_64-libyaml
      #       mingw-w64-ucrt-x86_64-libffi
      #       mingw-w64-ucrt-x86_64-ragel
      #       mingw-w64-ucrt-x86_64-ruby
      #       mingw-w64-ucrt-x86_64-gcc
      #       mingw-w64-ucrt-x86_64-make
      #       mingw-w64-ucrt-x86_64-bison
      #       mingw-w64-ucrt-x86_64-nm
      - name: setup Ruby and MSYS2
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.3'
      - name: set env
        run: |
          echo "GNUMAKEFLAGS=-j$((2 * NUMBER_OF_PROCESSORS))" >> $GITHUB_ENV

      - name: where check
        run: |
          result=true
          for e in gcc.exe ragel.exe make.exe bison.exe nm.exe; do
            echo '##['group']'$'\033[93m'$e$'\033[m'
            where $e || result=false
            echo '##['endgroup']'
          done
          $result

      - name: version check
        run: |
          # show version
          result=true
          for e in gcc ragel make bison nm; do
            case "$e" in *" "*) ;; *) e="$e --version";; esac
            echo '##['group']'$'\033[93m'$e$'\033[m'
            $e || result=false
            echo '##['endgroup']'
          done
          $result

      - name: autogen
        run: |
          ./autogen.sh
        working-directory: src

      - name: configure
        run: >
          ../src/configure --disable-install-doc --prefix="${HOME}/ruby"
          --disable-install-bin
          --enable-install-static-library
          --with-out-ext=openssl,readline,dbm,gdbm,win32ole
          --with-static-linked-ext
          --disable-rubygems
          --without-gmp
          --build=$CHOST --host=$CHOST --target=$CHOST

      - run: make
      - name: make install
        run: |
          make install-nodoc
      - name: Create artifacts
        run: |
          zip -r ruby-mingw-${{ matrix.abi }}.zip ${HOME}/ruby
      - uses: actions/upload-artifact@v4
        with:
          name: ruby-mingw-${{ matrix.abi }}.zip
          path: ruby-mingw-${{ matrix.abi }}.zip

defaults:
  run:
    working-directory: build
    shell: sh
